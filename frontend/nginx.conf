server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA routing — all paths serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # VULNERABLE #18: Source maps served publicly
    location ~* \.js\.map$ {
        add_header Content-Type application/json;
    }

    # VULNERABLE #23: No X-Frame-Options header → Clickjacking
    # add_header X-Frame-Options DENY;          -- intentionally omitted
    # add_header Content-Security-Policy "..."; -- intentionally omitted
}
